name: Cognitive router training
on:
  push:
    branches: [sweep/device-host-integration-20260908]
    paths:
      - .github/workflows/cognitive-router-training.yml
      - sweep_neural_mesh/training/train_cognitive_router.py
      - sweep_neural_mesh/training/datasets/comprehensive_train.jsonl
      - sweep_neural_mesh/training/datasets/comprehensive_val.jsonl
      - sweep_neural_mesh/training/datasets/comprehensive_test.jsonl
  workflow_dispatch:
permissions:
  contents: write
jobs:
  train-evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: {ref: sweep/device-host-integration-20260908}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12', cache: pip}
      - run: python -m pip install 'scikit-learn>=1.5,<2.0'
      - run: python -m unittest sweep_neural_mesh.tests.test_cognitive_router_contract -v
      - run: |
          mkdir -p artifacts/cognitive
          python -m sweep_neural_mesh.training.train_cognitive_router --data-dir sweep_neural_mesh/training/datasets --output-dir artifacts/cognitive | tee artifacts/cognitive/run.log
      - name: Persist measured metrics
        run: |
          mkdir -p docs/metrics
          cp artifacts/cognitive/cognitive_router_metrics.json docs/metrics/cognitive_router_metrics.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/metrics/cognitive_router_metrics.json
          if ! git diff --cached --quiet; then git commit -m 'docs(metrics): record cognitive router evaluation'; git push origin HEAD:sweep/device-host-integration-20260908; fi
      - uses: actions/upload-artifact@v4
        with:
          name: sweep-cognitive-router-${{ github.sha }}
          path: artifacts/cognitive/
          if-no-files-found: error
          retention-days: 30
