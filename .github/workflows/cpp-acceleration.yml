name: Optional C++ acceleration
on:
  push:
    branches: [sweep/device-host-integration-20260908]
    paths:
      - cpp/**
      - setup.py
      - pyproject.toml
      - .github/workflows/cpp-acceleration.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: {ref: sweep/device-host-integration-20260908}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile and run dataframe regression harness
        run: |
          g++ -std=c++20 -Wall -Wextra -Werror -Icpp/include \
            cpp/src/data_engine.cpp cpp/tests/test_data_engine.cpp \
            -o /tmp/sweep-data-engine-test
          /tmp/sweep-data-engine-test
      - name: Attempt full opt-in native package build
        env:
          SWEEP_BUILD_CPP: '1'
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
